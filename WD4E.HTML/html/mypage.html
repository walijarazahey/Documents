<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists and Images Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        img {
            max-width: 200px;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 10px 0;
        }
        h2 {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>HTML Lists and Images Demo</h1>

    <!-- Displaying an image -->
    <h2>My Favorite Animal</h2>
    <img src="cat.jpg" alt="A cute cat">

    <!-- Unordered List -->
    <h2>Shopping List</h2>
    <ul>
        <li>Milk</li>
        <li>Bread</li>
        <li>Eggs</li>
        <li>Butter</li>
    </ul>

    <!-- Ordered List -->
    <h2>Steps to Make Tea</h2>
    <ol>
        <li>Boil water</li>
        <li>Add tea leaves</li>
        <li>Pour into a cup</li>
        <li>Add sugar and milk</li>
        <li>Stir and serve</li>
    </ol>

    <!-- Another image -->
    <h2>Beautiful Landscape</h2>
    <img src="landscape.jpg" alt="A scenic landscape">

</body>
</html>
